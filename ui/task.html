<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Task</title>
    <link rel="stylesheet" href="./task.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand"><span class="mark" aria-hidden="true">◎</span><b>Hermes</b></div>
        <nav class="nav" aria-label="Sections">
          <button class="nav-pill active" data-nav="chat">Chat</button>
          <button class="nav-pill" data-nav="code">Code</button>
          <button class="nav-pill" data-nav="sessions">Sessions</button>
          <button class="nav-pill" data-nav="tasks">Tasks</button>
          <button class="nav-pill" data-nav="agents">Agents</button>
          <button class="nav-pill" data-nav="capabilities">Capabilities</button>
        </nav>
        <div class="top-right">
          <span class="pill" id="gh-pill" title="GitHub repository">GitHub</span>
          <span class="pill" id="branch-pill">no branch</span>
          <span class="dot" id="status-dot" title="agent status"></span>
          <button class="icon" id="toggle-agent" title="Toggle agent panel">▤</button>
          <div class="avatar-sm" id="avatar-sm">AJ</div>
        </div>
      </header>

      <div id="body">
        <aside id="rail">
          <button class="new-chat" id="new-chat">＋ New chat <kbd>⌘K</kbd></button>
          <div class="search"><input id="search" placeholder="Search" /></div>
          <button class="row-action" id="explore">Explore agents</button>
          <button class="row-action" id="inbox">Inbox</button>

          <div class="rail-section" id="pinned-section" hidden>
            <div class="section-label">Pinned</div>
            <div id="pinned" class="rail-list"></div>
          </div>

          <div class="section-label rail-main-label">Sessions <span id="session-count" class="count"></span></div>
          <div id="sessions" class="rail-list scroll"></div>

          <div class="rail-section collapsible collapsed" id="sched-section" hidden>
            <button class="section-label as-button" data-collapse="sched-section">Scheduled jobs
              <span class="count" id="sched-count"></span><span class="chev">›</span></button>
            <div id="scheduled" class="rail-list"></div>
          </div>

          <div class="rail-section collapsible collapsed" id="caps-section">
            <button class="section-label as-button" data-collapse="caps-section">Capabilities
              <span class="chev">›</span></button>
            <div id="capabilities" class="rail-list"></div>
          </div>

          <div class="rail-footer">
            <div class="avatar" id="avatar">AJ</div>
            <div class="who"><b id="user-name">Aldrin</b><em id="user-home">~/.hermes</em></div>
          </div>
        </aside>

        <section id="chat">
          <header id="chat-head">
            <div class="title-row">
              <h1 id="session-title">No session</h1>
              <span class="spacer"></span>
              <button class="icon" id="ws-toggle" title="Toggle files panel">▥</button>
              <button class="icon" id="more" title="Session actions">⋯</button>
            </div>
            <div class="sub" id="chat-sub">—</div>
          </header>
          <div id="transcript" class="scroll"></div>
          <div id="composer">
            <textarea id="input" rows="2" placeholder="Ask Hermes anything…"></textarea>
            <div class="composer-row">
              <button class="icon" id="attach" title="Attach files">＋</button>
              <button class="icon" id="mention" title="Mention a file">@</button>
              <button class="icon" id="image" title="Attach an image">▢</button>
              <span class="spacer"></span>
              <button class="pill small" id="model-btn" title="Change model">—</button>
              <button id="send" class="send" title="Send">↑</button>
            </div>
          </div>
        </section>

        <section id="workspace">
          <div class="ws-head">
            <span id="ws-repo" class="muted">no repository</span>
            <span class="spacer"></span>
            <button class="icon" id="ws-hide" title="Hide files panel">✕</button>
          </div>
          <div id="file-tabs" class="tabs-strip"></div>
          <div id="breadcrumb" class="breadcrumb">no file</div>
          <div id="code" class="code scroll"><div class="empty-note">No file selected</div></div>
          <div class="ws-tabs" id="ws-tabs">
            <button class="ws-tab active" data-pane="diff">Diff <span id="diff-count" class="count">0</span></button>
            <button class="ws-tab" data-pane="tests">Tests</button>
            <button class="ws-tab" data-pane="terminal">Terminal</button>
            <button class="ws-tab" data-pane="logs">Logs</button>
          </div>
          <div id="panes" class="scroll">
            <div class="pane" id="pane-diff"></div>
            <div class="pane" id="pane-tests" hidden></div>
            <div class="pane" id="pane-terminal" hidden></div>
            <div class="pane" id="pane-logs" hidden></div>
          </div>
        </section>

        <aside id="agent">
          <div class="agent-head">
            <span class="mark" aria-hidden="true">◎</span>
            <b>Hermes Agent</b>
            <span class="dot" id="agent-dot"></span>
            <span id="agent-state" class="muted">idle</span>
            <span class="spacer"></span>
            <button class="icon" id="agent-stop" title="Interrupt the running turn">⏹</button>
            <button class="icon" id="agent-close" title="Hide this panel">✕</button>
          </div>

          <div class="agent-section" id="goal-section">
            <div class="section-label">Goal</div>
            <div id="goal" class="goal-text">—</div>
          </div>

          <div class="agent-section" id="plan-section" hidden>
            <div class="section-label">Plan <span class="count" id="plan-meta"></span></div>
            <ol id="plan-list" class="plan"></ol>
          </div>

          <div class="agent-section" id="sub-section" hidden>
            <div class="section-label">Subagents <span class="count" id="sub-count"></span></div>
            <div id="subagents"></div>
          </div>

          <div class="agent-section collapsible collapsed" id="tools-section">
            <button class="section-label as-button" data-collapse="tools-section">Tools used
              <span class="count" id="tools-count"></span><span class="chev">›</span></button>
            <div id="agent-tools" class="chips"></div>
          </div>

          <div class="agent-section collapsible collapsed" id="context-section">
            <button class="section-label as-button" data-collapse="context-section">Context
              <span class="count" id="tree-count"></span><span class="chev">›</span></button>
            <div id="tree" class="tree"></div>
          </div>

          <div class="agent-section" id="jobs-section" hidden>
            <div class="section-label">Active jobs <span class="count" id="jobs-count"></span></div>
            <div id="jobs"></div>
          </div>

          <div class="agent-section">
            <div class="section-label">Run</div>
            <div class="stats">
              <div><span id="stat-messages">0</span><em>messages</em></div>
              <div><span id="stat-tools">0</span><em>calls</em></div>
              <div><span id="stat-elapsed">—</span><em>elapsed</em></div>
            </div>
            <div class="res-line">
              <span><em>cpu</em><b id="res-cpu">—</b></span>
              <span><em>mem</em><b id="res-mem">—</b></span>
              <span><em>tokens</em><b id="res-tokens">—</b></span>
            </div>
            <div class="meter"><div class="meter-fill" id="context-fill"></div></div>
            <div class="meter-line"><span id="context-text">—</span><span id="cache-text"></span></div>
          </div>

          <div class="agent-section">
            <div class="section-label">Changes</div>
            <select id="repo-picker" class="repo-picker" hidden></select>
            <div id="changes" class="changes-list"></div>
            <div class="pr-row">
              <span class="pill pr" id="pr-pill" hidden></span>
              <button class="mini" id="pr-action" hidden>Open PR</button>
            </div>
          </div>
        </aside>
      </div>
      <div id="attachments" class="attachments" hidden></div>
    </div>

    <div id="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true">
        <div class="modal-head"><b id="modal-title">—</b><button class="icon" id="modal-close">✕</button></div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>
    <script type="module" src="./task.js"></script>
  </body>
</html>
